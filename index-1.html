<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>운동하는날 숭실대점 미니맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fb;--surface:#fff;--fg:#1b2340;--muted:#5d6785;--line:#d5dcec;
  --ink:#1f3d8f;--on-ink:#fff;--err:#d23b3b;--chip:#eef3fb;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d1226;--surface:#18203f;--fg:#e8ecfb;--muted:#9aa5c8;--line:#2a3560;--ink:#8fb0ff;--on-ink:#0d1226;--err:#ff7a7a;--chip:#0d1226;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0d1226;--surface:#18203f;--fg:#e8ecfb;--muted:#9aa5c8;--line:#2a3560;--ink:#8fb0ff;--on-ink:#0d1226;--err:#ff7a7a;--chip:#0d1226;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
h1 small{font-weight:600;color:var(--muted);font-size:13px;margin-left:4px}
.pill{background:var(--ink);color:var(--on-ink);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.stage{position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#1d2550;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;image-rendering:pixelated;width:100%}
.joy{position:absolute;left:12px;bottom:12px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);display:none;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 0 rgba(0,0,0,.25)}
@media (pointer:coarse){.joy{display:block}}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:10px;border:0;background:rgba(15,20,45,.82);color:#fff;font-size:20px;font-weight:800;cursor:pointer;line-height:1}
.act{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;border:0;border-radius:99px;padding:12px 24px;font:inherit;font-size:15px;font-weight:800;background:#ffb84d;color:#1b2340;box-shadow:0 3px 0 rgba(0,0,0,.3);cursor:pointer}
.act[hidden]{display:none}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(15,20,45,.82);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.hint[hidden]{display:none}
.join{position:absolute;inset:0;background:rgba(10,14,34,.78);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.join[hidden]{display:none}
.card{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;width:100%;max-width:340px}
.card h2{margin:0;font-size:16px;text-align:center}
.card p{margin:0;font-size:12px;color:var(--muted);text-align:center}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
input[type=text]{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);color:var(--fg);min-width:0;width:100%}
input[type=text]:focus{outline:3px solid var(--ink);outline-offset:1px}
input.err{border-color:var(--err)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who label{position:relative}
.who input{position:absolute;opacity:0;pointer-events:none}
.who span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--chip);font-size:12px;font-weight:700;cursor:pointer}
.who input:checked+span{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 2px var(--ink) inset}
.who input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.who img{height:64px;image-rendering:pixelated}
button.go,button.send{font:inherit;font-weight:800;border:0;border-radius:12px;background:var(--ink);color:var(--on-ink);cursor:pointer}
button.go{font-size:15px;padding:12px}
.chat{margin-top:10px;display:grid;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font:inherit;font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.quick button:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.quick .ex,.quick button.ex{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.log{height:132px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.45;display:block}
.log div{padding:2px 0;overflow-wrap:anywhere}.log b{margin-right:6px}.log time{color:var(--muted);font-size:11px;margin-left:6px}.log .empty{color:var(--muted)}
.line{display:flex;gap:8px}
.line input{flex:1}
button.send{padding:0 18px;font-size:14px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:10px 2px 0;text-wrap:pretty}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>운동하는 날<small>숭실대점 · 미니맵</small></h1>
    <span class="pill" id="count">접속 0명</span>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="운동하는 날 숭실대점 미니맵. 방향키나 조이스틱으로 캐릭터를 움직이고 기구 앞에 서면 운동해요."></canvas>
    <div class="joy" id="joy" aria-hidden="true"><i id="knob"></i></div>
    <div class="zoom"><button type="button" id="zin" aria-label="확대">＋</button><button type="button" id="zout" aria-label="축소">－</button></div>
    <button type="button" class="act" id="act" hidden>운동하기</button>
    <div class="hint" id="hint" hidden></div>
    <div class="join" id="join">
      <form class="card" id="jf" autocomplete="off">
        <h2>운동하는 날 입장하기</h2>
        <p>이름을 정하고 캐릭터를 골라요</p>
        <label class="f">이름<input type="text" id="jname" maxlength="8" placeholder="이름 (8자 이내)"></label>
        <div class="who" role="radiogroup" aria-label="캐릭터">
          <label><input type="radio" name="g" value="m" checked><span><img id="pm" alt="">남자</span></label>
          <label><input type="radio" name="g" value="f"><span><img id="pf" alt="">여자</span></label>
        </div>
        <button class="go" type="submit">입장!</button>
      </form>
    </div>
  </div>
  <div class="chat">
    <div class="log" id="log" aria-live="polite"><span class="empty">아직 대화가 없어요. 한마디를 남겨봐요!</span></div>
    <div class="quick" id="acts" aria-label="바로 운동하기"></div>
    <div class="quick" id="quick"></div>
    <form class="line" id="cf" autocomplete="off">
      <input type="text" id="cmsg" maxlength="30" placeholder="한마디 (30자 이내)" aria-label="채팅">
      <button class="send" type="submit">보내기</button>
    </form>
  </div>
  <p class="note" id="note"></p>
</main>

function walkable(x,y){
  for(var i=0;i<WALK.length;i++){var r=WALK[i];if(x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3])return true;}
  return false;
}
function randWalk(){var r=WALK[Math.floor(Math.random()*WALK.length)];return [r[0]+10+Math.random()*(r[2]-r[0]-20),r[1]+10+Math.random()*(r[3]-r[1]-20)];}

function nearStation(r){
  if(!me)return null;var best=null,bd=r;
  Object.keys(ST).forEach(function(id){var d=Math.hypot(me.x-ST[id].ap[0],me.y-ST[id].ap[1]);if(d<bd&&!occupied(id,me)){bd=d;best=id;}});
  return best;
}
function startEx(id){
  if(!me||!id)return;
  if(occupied(id,me)){showHint('다른 사람이 쓰고 있어요',2000);return;}
  me.a=id;me.x=ST[id].ap[0];me.y=ST[id].ap[1];me.d=0;me.mv=0;tapTarget=null;tapStation=null;trainerTip(ST[id].n);
}
function stopEx(){if(!me||!me.a)return;if(me.a.indexOf('x:')===0){me.a='';exitCD=.5;return;}var s=ST[me.a];me.a='';me.x=s.ap[0];me.y=s.ap[1]+34;if(blocked(me.x,me.y)){me.y=s.ap[1];}exitCD=1.2;}
var actBtn=document.getElementById('act');
actBtn.addEventListener('click',function(){if(me.a)stopEx();else startEx(nearStation(70));});
window.addEventListener('keydown',function(e){

});

/* ---------- 업데이트 ---------- */
function update(dt,now){
  if(!me)return;
  var ix=(keys.r?1:0)-(keys.l?1:0)+joy.x,iy=(keys.d?1:0)-(keys.u?1:0)+joy.y;
  if(Math.abs(ix)>.01||Math.abs(iy)>.01)tapTarget=null;
  else if(tapTarget){
    var tx=tapTarget.x-me.x,ty=tapTarget.y-me.y,dd=Math.hypot(tx,ty);
    tapT+=dt;
    if(dd<4){tapTarget=null;if(tapStation){startEx(tapStation);tapStation=null;}}
    else if(tapT>8){tapTarget=null;tapStation=null;}
    else{ix=tx/dd;iy=ty/dd;}
  }
  var mag=Math.hypot(ix,iy);
  if(mag>.12){
    if(mag>1){ix/=mag;iy/=mag;}
    if(me.a){stopEx();}
    var sp=120,nx=me.x+ix*sp*dt,ny=me.y+iy*sp*dt;
    if(!blocked(nx,me.y))me.x=nx;
    if(!blocked(me.x,ny))me.y=ny;
    clampPos(me);
    me.d=Math.abs(ix)>Math.abs(iy)?(ix<0?2:3):(iy<0?1:0);
    me.mv=1;idleT=0;
  }else{
    me.mv=0;idleT+=dt;
    exitCD=Math.max(0,exitCD-dt);
    if(!me.a&&!tapTarget&&idleT>.25&&exitCD<=0){
      var ns=nearStation(46);if(ns)startEx(ns);
    }
  }
  if(me.msg&&now-me.msgAt>5000)me.msg='';
}
function lerpEnt(e,dt){
  var f=Math.min(1,dt*10),ox=e.x,oy=e.y;
  e.x+=(e.tx-e.x)*f;e.y+=(e.ty-e.y)*f;
  if(e.net){e.mv=Math.hypot(e.tx-e.x,e.ty-e.y)>1.2?1:0;
    var dx=e.tx-ox,dy=e.ty-oy;
    if(Math.hypot(dx,dy)>.05)e.d=Math.abs(dx)>Math.abs(dy)?(dx<0?2:3):(dy<0?1:0);}
  if(e.msg&&performance.now()-e.msgAt>5000)e.msg='';
}

function img(key,x,y,flip){

}
function shadow(x,y,w){ctx.fillStyle='rgba(20,28,60,.18)';ctx.beginPath();ctx.ellipse(x,y,w,w*.35,0,0,6.3);ctx.fill();}

  ctx.imageSmoothingEnabled=true;ctx.drawImage(SPR.map,0,0,WW,WH);ctx.imageSmoothingEnabled=false;
}
function tag(e,x,topY){
  ctx.font='700 10px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  var w=ctx.measureText(e.n).width+10;
  ctx.fillStyle=e===me?'#ffb84d':'rgba(24,32,70,.88)';
  rr(x-w/2,topY-13,w,14,7);ctx.fill();
  ctx.fillStyle=e===me?'#1b2340':'#fff';ctx.fillText(e.n,x,topY-6);
  if(e.msg&&performance.now()>=e.msgAt){
    var lines=[],t=e.msg;while(t.length){lines.push(t.slice(0,15));t=t.slice(15);}
    var bw=0;lines.forEach(function(l){bw=Math.max(bw,ctx.measureText(l).width);});bw+=14;
    var bh=lines.length*13+7,by=topY-18-bh;
    ctx.fillStyle='#fff';rr(x-bw/2,by,bw,bh,5);ctx.fill();
    ctx.beginPath();ctx.moveTo(x-4,by+bh);ctx.lineTo(x+4,by+bh);ctx.lineTo(x,by+bh+5);ctx.fill();
    ctx.fillStyle='#1b2340';lines.forEach(function(l,i){ctx.fillText(l,x,by+9+i*13);});
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  }

  drawFloor();
  var all=[];
  if(me)all.push(me);
  Object.keys(others).forEach(function(i){all.push(others[i]);});
  bots.forEach(function(b){all.push(b);});
  var busy={};all.forEach(function(e){if(e.a)busy[e.a]=true;});
  items.push({y:dog.y,f:function(){shadow(dog.x,dog.y,10);img('corgi',dog.x,dog.y+(dog.mv&&Math.floor(now/140)%2?-1.5:0),dog.f<0);}});
  all.forEach(function(e){
    var sp=entSprite(e,now);
    items.push({y:sp.sy,f:function(){
      if(!e.a)shadow(sp.x,sp.sy,11);
      img(sp.key,sp.x,sp.y);
    }});
  });
  items.sort(function(a,b){return a.y-b.y;});
  items.forEach(function(it){it.f();});
  /* 가까이 가면 기구 이름 */
  if(me&&!me.a){
    ctx.font='700 11px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    var best=null,bd=70;
    Object.keys(ST).forEach(function(id){var d=Math.hypot(me.x-ST[id].ap[0],me.y-ST[id].ap[1]);if(d<bd){bd=d;best=id;}});
    if(best){
      var q=ST[best],t=q.n+(occupied(best,me)?' (사용 중)':' · 가까이 서면 운동!'),w=ctx.measureText(t).width+14;
      ctx.fillStyle='rgba(24,32,70,.9)';rr(q.ap[0]-w/2,q.ap[1]+8,w,16,8);ctx.fill();
      ctx.fillStyle='#fff';ctx.fillText(t,q.ap[0],q.ap[1]+16);
    }
  }
  /* 이름표 / 말풍선 */
  all.forEach(function(e){var sp=entSprite(e,now);tag(e,sp.x,sp.y-sh(sp.key)-2);});
}

/* ---------- 카메라 / 크기 ---------- */
function fit(){
  var cssW=stage.clientWidth;
  baseVW=cssW<560?330:640;baseVH=400;
  var cssH=Math.round(cssW*baseVH/baseVW),dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.height=cssH+'px';cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  applyZoom();
}
function applyZoom(){VW=baseVW/zoom;VH=baseVH/zoom;k=cv.width/VW;}
function cam(){
  var fx=me?me.x:WW/2,fy=me?me.y:WH/2;
  camX=VW>=WW?(WW-VW)/2:Math.min(WW-VW,Math.max(0,fx-VW/2));camY=VH>=WH?(WH-VH)/2:Math.min(WH-VH,Math.max(0,fy-VH/2));
  
}

/* ---------- 네트워크 (Firebase Realtime Database) ---------- */
function startNet(){
  var statusEl=document.getElementById('note');
  var sdk=['https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js','https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'];
  function load(i,cb){if(i>=sdk.length)return cb();var s=document.createElement('script');s.src=sdk[i];s.onload=function(){load(i+1,cb);};s.onerror=function(){fail();};document.head.appendChild(s);}
  function fail(){setNote('실시간 연결에 실패했어요. 샘플 모드로 보여요.');mkBots();net=null;}
  load(0,function(){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      var db=firebase.database(),base=db.ref('gym/'+ROOM+'/players'),mine=base.child(me.id),off=0;
      db.ref('.info/serverTimeOffset').on('value',function(s){off=s.val()||0;});
      mine.onDisconnect().remove();
      var last='',lastSend=0,mtSent=0;
      function pack(){return {n:me.n,g:me.g,x:Math.round(me.x),y:Math.round(me.y),d:me.d,a:me.a||'',m:me.msg||'',mt:me.mt};}
      var chatRef=db.ref('gym/'+ROOM+'/chat');
      chatRef.limitToLast(50).on('child_added',function(sn){var v=sn.val();if(v&&v.m)addLog(String(v.n||'?').slice(0,8),String(v.m).slice(0,30),v.t);});
      net={
        push:function(n,m){chatRef.push({n:n,m:m,t:firebase.database.ServerValue.TIMESTAMP});},
        tick:function(now){
          var p=pack(),s=JSON.stringify(p);
          if((s!==last&&now-lastSend>110)||now-lastSend>8000){
            last=s;lastSend=now;p.t=firebase.database.ServerValue.TIMESTAMP;mine.set(p);
          }
        }
      };
      base.on('child_added',upsert);base.on('child_changed',upsert);
      base.on('child_removed',function(s){delete others[s.key];updCount();});
      function upsert(s){
        var v=s.val(),id=s.key;if(!v||id===me.id)return;
        if(Object.keys(others).length>=40&&!others[id])return;
        if(v.t&&Date.now()+off-v.t>60000){return;}
        var e=others[id];
        if(!e){e=others[id]=mkEntity({id:id,n:String(v.n||'?').slice(0,8),g:v.g==='f'?'f':'m',x:+v.x||765,y:+v.y||938});e.net=true;e.mt=-1;}
        e.n=String(v.n||'?').slice(0,8);e.g=v.g==='f'?'f':'m';e.tx=+v.x||e.tx;e.ty=+v.y||e.ty;
        e.a=validA(v.a)?v.a:'';
        if(e.a&&ST[e.a]){e.x=ST[e.a].ap[0];e.y=ST[e.a].ap[1];e.tx=e.x;e.ty=e.y;}
        if(v.mt!==e.mt){e.mt=v.mt;if(v.m){e.msg=String(v.m).slice(0,30);e.msgAt=performance.now();}}
        updCount();
      }
      /* 오래된(유령) 접속 정리 */
      setInterval(function(){
        var now=Date.now()+off;
        base.once('value',function(s){s.forEach(function(c){var v=c.val();if(v&&v.t&&now-v.t>60000)c.ref.remove();});});
      },30000);
      setNote('실시간으로 연결됐어요. 다른 사람이 들어오면 바로 나타나요!');
    }catch(err){fail();}
  });
}
function setNote(t){document.getElementById('note').textContent=t;}
function updCount(){
  var n=1+Object.keys(others).length+(net?0:bots.length);
  document.getElementById('count').textContent=(net?'':'샘플 · ')+'접속 '+n+'명';
}

/* ---------- 채팅 ---------- */
var logEl=document.getElementById('log'),logN=0;
function addLog(name,text,ts){
  if(!logN)logEl.textContent='';
  var d=document.createElement('div'),b=document.createElement('b'),t=document.createElement('span'),tm=document.createElement('time');
  b.textContent=name;t.textContent=text;
  var dt=ts?new Date(ts):new Date();tm.textContent=('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
  d.appendChild(b);d.appendChild(t);d.appendChild(tm);logEl.appendChild(d);logN++;
  while(logEl.children.length>60)logEl.removeChild(logEl.firstChild);
  logEl.scrollTop=logEl.scrollHeight;
}
function say(text){
  text=(text||'').trim().slice(0,30);if(!text||!me)return;
  me.msg=text;me.msgAt=performance.now();me.mt++;
  if(net&&net.push)net.push(me.n,text);else addLog(me.n,text);
}
var actsEl=document.getElementById('acts');
Object.keys(FREE).forEach(function(k){
  var b=document.createElement('button');b.type='button';b.textContent=FREE[k].n;b.className='ex';
  b.addEventListener('click',function(){if(me)startFree(k);});actsEl.appendChild(b);
});
var quick=document.getElementById('quick');
['화이팅!','오늘 하체 가는 날','같이 운동해요','3층 올라왔어요 ㅋㅋ'].forEach(function(t){
  var b=document.createElement('button');b.type='button';b.textContent=t;b.addEventListener('click',function(){say(t);});quick.appendChild(b);
});
function doChat(){var i=document.getElementById('cmsg');say(i.value);i.value='';}
document.getElementById('cf').addEventListener('submit',function(e){e.preventDefault();});
var sb=document.querySelector('#cf button.send');sb.type='button';sb.addEventListener('click',doChat);
document.getElementById('cmsg').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doChat();}});

/* ---------- 입장 ---------- */
function boot(){
  document.getElementById('pm').src=ATLAS.m_F[0];
  document.getElementById('pf').src=ATLAS.f_F[0];
  ATLAS_DONE=true;
  fit();
  var nm=store('g','gymName');if(nm)document.getElementById('jname').value=nm;
  var gg=store('g','gymG');if(gg==='f')document.querySelector('input[name=g][value=f]').checked=true;
  requestAnimationFrame(loop);
}
var ATLAS_DONE=false;
document.getElementById('jname').addEventListener('input',function(){this.classList.remove('err');});
function doJoin(){
  var n=document.getElementById('jname').value.trim(),g=document.querySelector('input[name=g]:checked').value;
  if(!n){var i=document.getElementById('jname');i.classList.add('err');i.focus();return;}
  store('s','gymName',n);store('s','gymG',g);
  me=mkEntity({id:'u'+Math.random().toString(36).slice(2,9),n:n,g:g,x:765,y:938});me.mt=0;
  document.getElementById('join').hidden=true;
  mkTrainer();
  if(FIREBASE_CONFIG){startNet();}else{mkBots();setNote('샘플 모드예요. 혼자 보는 화면이고, 아래 설정을 켜면 실시간으로 다른 사람이 들어와요.');}
  updCount();showHint('방향키·조이스틱·화면 터치로 이동! 기구 근처에 서면 운동해요. 기구를 눌러도 돼요',5000);
}
var jb=document.querySelector('#jf button.go');
document.getElementById('jf').addEventListener('submit',function(e){e.preventDefault();});
jb.type='button';jb.addEventListener('click',doJoin);
document.getElementById('jname').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doJoin();}});
var hintT=0;
function showHint(t,ms){var h=document.getElementById('hint');h.textContent=t;h.hidden=false;clearTimeout(hintT);hintT=setTimeout(function(){h.hidden=true;},ms);}

/* ---------- 루프 ---------- */
var lastT=0;
function loop(now){
  var dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;
  update(dt,now);updBots(dt,now);updDog(dt);
  Object.keys(others).forEach(function(i){lerpEnt(others[i],dt);});
  if(net)net.tick(now);
  cam();syncAct();render(now);
  requestAnimationFrame(loop);
}
window.addEventListener('resize',function(){if(ATLAS_DONE)fit();});
window.__gym={get me(){return me;},ST:ST};
})();
</script>
